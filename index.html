```html
<!DOCTYPE html>
<html>
<head>
  <title>OIIA Game</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #login {
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
    }

    input {
      width: 260px;
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      outline: none;
    }

    button {
      margin-top: 12px;
      padding: 12px 25px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
    }

    #error {
      color: #ff5555;
      margin-top: 12px;
      display: none;
    }
  </style>
</head>

<body>

  <div id="login">
    <h1>Enter Password</h1>

    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="off"
    >

    <br>

    <button onclick="checkPassword()">
      Enter
    </button>

    <div id="error">
      Incorrect password.
    </div>
  </div>

  <script>
    const PASSWORD = "OIIA_IS_GOD";

    function checkPassword() {
      const entered = document.getElementById("password").value;

      if (entered === PASSWORD) {
        openGame();
      } else {
        document.getElementById("error").style.display = "block";
      }
    }

    document.getElementById("password").addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        checkPassword();
      }
    });

    function openGame() {
      const win = window.open("about:blank", "_blank");

      if (!win) {
        alert("Please allow pop-ups for this site.");
        return;
      }

      win.document.open();

      win.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
          <title>Game</title>

          <style>
            html, body {
              margin: 0;
              width: 100%;
              height: 100%;
              overflow: hidden;
              background: #000;
            }

            iframe {
              width: 100%;
              height: 100%;
              border: 0;
            }
          </style>
        </head>

        <body>

          <iframe
            src="https://www.crazygames.com/embed/ragdoll-archers"
            allow="gamepad *;">
          </iframe>

        </body>
        </html>
      `);

      win.document.close();
    }
  </script>

</body>
</html>
```
