<!DOCTYPE html>
<html>
<head>
  <title>Game Launcher</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
      padding-top: 100px;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <h1>Ragdoll Archers</h1>

  <button onclick="openGame()">
    Play Game
  </button>

  <script>
    function openGame() {
      // Open a new blank tab
      const win = window.open("about:blank", "_blank");

      if (!win) {
        alert("Please allow pop-ups for this site.");
        return;
      }

      // Put the game into the blank page
      win.document.open();

      win.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
          <title>Game</title>
          <style>
            html, body {
              margin: 0;
              width: 100%;
              height: 100%;
              overflow: hidden;
              background: #000;
            }

            iframe {
              width: 100%;
              height: 100%;
              border: 0;
            }
          </style>
        </head>

        <body>
          <iframe
            src="https://www.crazygames.com/embed/ragdoll-archers"
            allow="gamepad *;">
          </iframe>
        </body>
        </html>
      `);

      win.document.close();
    }
  </script>

</body>
</html>
