<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Game Launcher</title>

  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
    }

    #login {
      width: min(330px, calc(100% - 40px));
      text-align: center;
    }

    h1 {
      margin: 0 0 20px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 16px;
      border: 0;
      border-radius: 6px;
      outline: none;
    }

    button {
      margin-top: 12px;
      padding: 12px 25px;
      font-size: 16px;
      cursor: pointer;
      border: 0;
      border-radius: 6px;
    }

    #error {
      display: none;
      margin-top: 12px;
      color: #ff5555;
    }
  </style>
</head>

<body>
  <div id="login">
    <h1>Enter Password</h1>

    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="off"
    >

    <button id="enterButton" type="button">
      Open launcher
    </button>

    <div id="error">
      Incorrect password.
    </div>
  </div>

  <script>
    const PASSWORD = "OIIA_IS_GOD";

    const GAMES = [
      {
        name: "Ragdoll Archers",
        url: "https://www.crazygames.com/embed/ragdoll-archers"
      },
      {
        name: "OvO",
        url: "https://dedragames.com/games/ovo/1.4.5/index.html"
      },
      {
        name: "Derby Cars Arena",
        url: "https://unblocked-games.s3.amazonaws.com/derby-cars-arena.html"
      },
      {
        name: "Agent Smith",
        url: "https://unblocked-games.s3.amazonaws.com/agent-smith.html"
      },
      {
        name: "Drift Boss",
        url: "https://motox3m2.io/drift-boss"
      },
      {
        name: "Moto X3M Pool Party",
        url: "https://unblocked-games.s3.amazonaws.com/moto-x3m-pool-party.html"
      },
      {
        name: "Moto X3M Spooky Land",
        url: "https://unblocked-games.s3.amazonaws.com/moto-x3m-spooky-land.html"
      },
      {
        name: "Moto X3M Winter",
        url: "https://unblocked-games.s3.amazonaws.com/moto-x3m-winter.html"
      },
      {
        name: "Moto X3M",
        url: "https://unblocked-games.s3.amazonaws.com/moto-x3m.html"
      }
    ];

    const passwordInput = document.getElementById("password");
    const errorBox = document.getElementById("error");
    const enterButton = document.getElementById("enterButton");

    enterButton.addEventListener("click", checkPassword);

    passwordInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        checkPassword();
      }
    });

    function checkPassword() {
      if (passwordInput.value !== PASSWORD) {
        errorBox.style.display = "block";
        return;
      }

      errorBox.style.display = "none";
      openGameLauncher();
    }

    function openGameLauncher() {
      const gameTab = window.open("about:blank", "_blank");

      if (!gameTab) {
        alert("Please allow pop-ups for this page, then try again.");
        return;
      }

      gameTab.document.open();
      gameTab.document.write(makeLauncherPage());
      gameTab.document.close();
    }

    function makeLauncherPage() {
      const safeGames = JSON.stringify(GAMES).replace(/</g, "\\u003c");

      return `<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Game Launcher</title>

  <style>
    :root {
      --bar-opacity: 0.88;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #frames {
      width: 100%;
      height: 100%;
    }

    .game-frame {
      display: none;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }

    .game-frame.active {
      display: block;
    }

    /*
      This is the movable control box.
      Drag the top row labeled "Game Launcher" to move it.
    */
    #controlBar {
      position: fixed;
      z-index: 1000;
      top: 12px;
      left: 12px;
      width: min(620px, calc(100vw - 24px));
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 10px;
      overflow: hidden;
      background: rgba(20, 20, 20, var(--bar-opacity));
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(6px);
      touch-action: none;
      user-select: none;
    }

    #barHeader {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      padding: 0 8px 0 12px;
      background: rgba(0, 0, 0, 0.18);
      cursor: grab;
    }

    #barHeader:active {
      cursor: grabbing;
    }

    #barTitle {
      flex: 1;
      overflow: hidden;
      color: white;
      font-size: 14px;
      font-weight: bold;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .bar-icon-button {
      width: 30px;
      height: 28px;
      margin: 0;
      padding: 0;
      color: white;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 6px;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
    }

    .bar-icon-button:hover {
      background: rgba(88, 101, 242, 0.9);
    }

    #barContent {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 8px;
      max-height: 145px;
      overflow-y: auto;
    }

    .game-button {
      margin: 0;
      padding: 8px 12px;
      color: white;
      background: rgba(48, 48, 48, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 6px;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
    }

    .game-button:hover,
    .game-button.active {
      background: #5865f2;
      border-color: #7c86ff;
    }

    /*
      In minimized mode, only the header remains.
      The bar stays movable because the header is still visible.
    */
    #controlBar.minimized {
      width: auto;
      min-width: 145px;
    }

    #controlBar.minimized #barContent,
    #controlBar.minimized #settingsPanel {
      display: none;
    }

    #controlBar.minimized #barTitle {
      flex: 0;
    }

    #settingsPanel {
      display: none;
      padding: 10px 12px 12px;
      color: white;
      background: rgba(0, 0, 0, 0.26);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      user-select: text;
    }

    #settingsPanel.open {
      display: block;
    }

    .settings-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .settings-row label {
      min-width: 104px;
      font-size: 14px;
    }

    #opacityRange {
      flex: 1;
      min-width: 120px;
      cursor: pointer;
    }

    #opacityValue {
      min-width: 40px;
      text-align: right;
      font-size: 14px;
    }

    #loading {
      position: fixed;
      z-index: 999;
      right: 12px;
      bottom: 12px;
      padding: 8px 10px;
      color: white;
      background: rgba(0, 0, 0, 0.75);
      border-radius: 6px;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <div id="frames"></div>

  <div id="controlBar">
    <div id="barHeader">
      <div id="barTitle">Game Launcher</div>

      <button
        id="settingsButton"
        class="bar-icon-button"
        type="button"
        title="Settings"
        aria-label="Open settings"
      >
        ⚙
      </button>

      <button
        id="minimizeButton"
        class="bar-icon-button"
        type="button"
        title="Minimize"
        aria-label="Minimize launcher"
      >
        −
      </button>
    </div>

    <div id="barContent"></div>

    <div id="settingsPanel">
      <div class="settings-row">
        <label for="opacityRange">Bar opacity</label>

        <input
          id="opacityRange"
          type="range"
          min="1"
          max="100"
          value="88"
        >

        <span id="opacityValue">88%</span>
      </div>
    </div>
  </div>

  <div id="loading">
    Loading games...
  </div>

  <script>
    const games = ${safeGames};

    const frames = document.getElementById("frames");
    const bar = document.getElementById("controlBar");
    const barHeader = document.getElementById("barHeader");
    const barContent = document.getElementById("barContent");
    const settingsPanel = document.getElementById("settingsPanel");
    const settingsButton = document.getElementById("settingsButton");
    const minimizeButton = document.getElementById("minimizeButton");
    const opacityRange = document.getElementById("opacityRange");
    const opacityValue = document.getElementById("opacityValue");
    const loadingText = document.getElementById("loading");

    let loadedCount = 0;
    let dragging = false;
    let dragOffsetX = 0;
    let dragOffsetY = 0;

    /*
      Create every iframe once. The game URL is assigned here only.
      Switching buttons later never changes a frame's src.
    */
    games.forEach(function (game, index) {
      const button = document.createElement("button");
      button.className = "game-button";
      button.type = "button";
      button.textContent = game.name;
      button.dataset.index = index;

      const frame = document.createElement("iframe");
      frame.className = "game-frame";
      frame.id = "game-frame-" + index;
      frame.title = game.name;
      frame.loading = "eager";
      frame.allow = "gamepad *; fullscreen";
      frame.src = game.url;

      frame.addEventListener("load", function () {
        loadedCount++;

        if (loadedCount >= games.length) {
          loadingText.textContent = "Games loaded";

          setTimeout(function () {
            loadingText.style.display = "none";
          }, 1200);
        } else {
          loadingText.textContent =
            "Loading games... " + loadedCount + "/" + games.length;
        }
      });

      button.addEventListener("click", function () {
        showGame(index);
      });

      barContent.appendChild(button);
      frames.appendChild(frame);
    });

    function showGame(index) {
      document.querySelectorAll(".game-frame").forEach(function (frame) {
        frame.classList.remove("active");
      });

      document.querySelectorAll(".game-button").forEach(function (button) {
        button.classList.remove("active");
      });

      document
        .getElementById("game-frame-" + index)
        .classList.add("active");

      document
        .querySelector('.game-button[data-index="' + index + '"]')
        .classList.add("active");
    }

    function updateOpacity() {
      const percent = Number(opacityRange.value);
      const decimal = percent / 100;

      document.documentElement.style.setProperty(
        "--bar-opacity",
        decimal.toFixed(2)
      );

      opacityValue.textContent = percent + "%";
    }

    opacityRange.addEventListener("input", updateOpacity);

    settingsButton.addEventListener("click", function (event) {
      event.stopPropagation();
      settingsPanel.classList.toggle("open");
    });

    minimizeButton.addEventListener("click", function (event) {
      event.stopPropagation();

      const isMinimized = bar.classList.toggle("minimized");

      minimizeButton.textContent = isMinimized ? "+" : "−";
      minimizeButton.title = isMinimized ? "Restore" : "Minimize";
      minimizeButton.setAttribute(
        "aria-label",
        isMinimized ? "Restore launcher" : "Minimize launcher"
      );

      if (isMinimized) {
        settingsPanel.classList.remove("open");
      }
    });

    /*
      Drag only from empty/title area of the bar header.
      Buttons still work normally and do not start a drag.
    */
    barHeader.addEventListener("pointerdown", function (event) {
      if (event.target.closest("button")) {
        return;
      }

      const rect = bar.getBoundingClientRect();

      dragging = true;
      dragOffsetX = event.clientX - rect.left;
      dragOffsetY = event.clientY - rect.top;

      barHeader.setPointerCapture(event.pointerId);
    });

    barHeader.addEventListener("pointermove", function (event) {
      if (!dragging) {
        return;
      }

      const rect = bar.getBoundingClientRect();

      const maxLeft = Math.max(0, window.innerWidth - rect.width);
      const maxTop = Math.max(0, window.innerHeight - rect.height);

      const newLeft = Math.min(
        Math.max(0, event.clientX - dragOffsetX),
        maxLeft
      );

      const newTop = Math.min(
        Math.max(0, event.clientY - dragOffsetY),
        maxTop
      );

      bar.style.left = newLeft + "px";
      bar.style.top = newTop + "px";
      bar.style.right = "auto";
    });

    function stopDragging(event) {
      if (!dragging) {
        return;
      }

      dragging = false;

      if (barHeader.hasPointerCapture(event.pointerId)) {
        barHeader.releasePointerCapture(event.pointerId);
      }
    }

    barHeader.addEventListener("pointerup", stopDragging);
    barHeader.addEventListener("pointercancel", stopDragging);

    if (games.length > 0) {
      showGame(0);
    } else {
      loadingText.textContent = "No games were added.";
    }

    updateOpacity();
  <\/script>
</body>
</html>`;
    }
  </script>
</body>
</html>
